name: Skills CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check skill.md frontmatter
        shell: python
        run: |
          import re, sys
          from pathlib import Path

          errors, names = [], {}
          skill_files = sorted(p for p in Path(".").rglob("skill.md") if ".git" not in p.parts)
          for path in skill_files:
              if len(path.parts) != 2:
                  errors.append(f"{path}: skill.md must sit directly in <skill-name>/")
                  continue
              text = path.read_text(encoding="utf-8")
              match = re.match(r"---\n(.*?)\n---\n(.*)\Z", text, re.S)
              if not match:
                  errors.append(f"{path}: missing frontmatter")
                  continue
              fields = dict(re.findall(r"^([A-Za-z_-]+):[ \t]*(.*)$", match.group(1), re.M))
              name = fields.get("name", "").strip().strip("'\"")
              description = fields.get("description", "").strip().strip("'\"")
              if name != path.parent.name:
                  errors.append(f"{path}: name {name!r} must equal the directory name")
              if not description:
                  errors.append(f"{path}: missing description")
              if name in names:
                  errors.append(f"{path}: duplicate name {name!r} (also {names[name]})")
              names[name] = path
              # Worked examples may quote a member in their own language.
              prose = re.split(r"^#+ .*\bExample\b.*$", match.group(2), maxsplit=1, flags=re.M)[0]
              if re.search(r"[\u4e00-\u9fff]", prose):
                  errors.append(f"{path}: skill body must be English (worked examples excepted)")
          if not skill_files:
              errors.append("no <skill-name>/skill.md found")
          print("\n".join(errors) if errors else f"OK: {len(skill_files)} skills")
          sys.exit(1 if errors else 0)
